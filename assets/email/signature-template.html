<!-- Critical Element email signature template.
     Replace the four {{placeholders}}. Keep inline styles: email clients ignore stylesheets.
     Image URLs must stay absolute and must never change. Prefer the generator at https://criticalelement.io/signature/ -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td valign="middle" style="padding:0 14px 0 0;">
      <a href="https://criticalelement.io" style="text-decoration:none;"><img src="https://criticalelement.io/assets/email/ce-mark-black-128.png" width="44" height="44" alt="Critical Element" style="display:block;width:44px;height:44px;border:0;"></a>
    </td>
    <td width="2" bgcolor="#E26738" style="width:2px;background-color:#E26738;font-size:0;line-height:0;">&nbsp;</td>
    <td valign="middle" style="padding:0 0 0 14px;">
      <div style="font-size:14px;line-height:18px;font-weight:bold;color:#161513;">{{name}}</div>
      <div style="font-size:13px;line-height:18px;color:#54534E;">{{title}}</div>
      <div style="font-size:13px;line-height:18px;color:#161513;"><a href="https://criticalelement.io" style="color:#B8461F;text-decoration:none;">CriticalElement.io</a><span style="color:#878681;">&nbsp;&nbsp;|&nbsp;&nbsp;</span><a href="mailto:{{email}}" style="color:#161513;text-decoration:none;">{{email}}</a><span style="color:#878681;">&nbsp;&nbsp;|&nbsp;&nbsp;</span>{{phone}}</div>
    </td>
  </tr>
</table>
