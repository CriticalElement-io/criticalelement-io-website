<!-- Critical Element email signature template.
     Replace the four {{placeholders}}. Keep inline styles: email clients ignore stylesheets.
     Image URLs must stay absolute and must never change. Prefer the generator at https://criticalelement.io/signature/ -->
<table cellpadding="0" cellspacing="0" border="0" role="presentation" style="border-collapse:collapse;font-family:Arial,Helvetica,sans-serif;">
  <tr>
    <td valign="middle" style="padding:0 20px 0 0;">
      <a href="https://criticalelement.io" style="text-decoration:none;"><img src="https://criticalelement.io/assets/email/ce-mark-black-128.png" width="64" height="64" alt="Critical Element" style="display:block;width:64px;height:64px;border:0;"></a>
    </td>
    <td width="2" bgcolor="#E26738" style="width:2px;background-color:#E26738;font-size:0;line-height:0;">&nbsp;</td>
    <td valign="middle" style="padding:0 0 0 20px;">
      <div style="font-size:18px;line-height:24px;font-weight:bold;color:#161513;">{{name}}</div>
      <div style="font-size:14px;line-height:20px;color:#54534E;">{{title}}</div>
      <div style="font-size:14px;line-height:20px;padding-top:10px;"><a href="https://criticalelement.io" style="color:#B8461F;text-decoration:none;">CriticalElement.io</a></div>
      <div style="font-size:14px;line-height:20px;color:#161513;"><a href="mailto:{{email}}" style="color:#161513;text-decoration:none;">{{email}}</a></div>
      <div style="font-size:14px;line-height:20px;color:#161513;">{{phone}}</div>
    </td>
  </tr>
</table>
